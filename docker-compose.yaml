# Airflow env fragment: merge into each service so we can override migrate flags on airflow-init only.
# _AIRFLOW_DB_MIGRATE / _AIRFLOW_WWW_USER_CREATE stay false here so webserver, scheduler and worker
# do not race concurrent DB migrations and admin bootstrap (fixes duplicate-key noise in logs).
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor
  AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
  AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
  AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 5
  _AIRFLOW_DB_MIGRATE: 'false'
  _AIRFLOW_WWW_USER_CREATE: 'false'
  _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
  _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  # Must match postgres service POSTGRES_DB (OLTP + Airflow metadata live in this database).
  POSTGRES_DB: ${POSTGRES_DB:-airflow}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MINIO_PROD_BUCKET_NAME: ${MINIO_PROD_BUCKET_NAME}

x-airflow-common: &airflow-common
  build:
    context: ./airflow_dockerfile
    dockerfile: Dockerfile
  user: "${AIRFLOW_UID}:${AIRFLOW_GID}"
  env_file:
    - .env
  environment:
    <<: *airflow-env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./scripts:/opt/airflow/scripts
    - ./dbt_click:/opt/dbt_click
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - all_in_one

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Single DB: Airflow metadata + OLTP schemas (web/oms/wms/marketing). Keep in sync with AIRFLOW__CORE__SQL_ALCHEMY_CONN.
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./src/init_db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - all_in_one

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      - all_in_one

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./docker_related_config.xml:/etc/clickhouse-server/config.d/docker_related_config.xml
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - all_in_one

  # ---------------------------------------------------------------
  # Synthetic data generator: continuously populates OLTP sources
  # ---------------------------------------------------------------
  data-generator:
    build:
      context: ./synthetic_data_generator
      dockerfile: Dockerfile
    container_name: data-generator
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      GENERATOR_INTERVAL_SECONDS: "15"
      GENERATOR_HISTORY_DAYS: "30"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - all_in_one

  # ---------------------------------------------------------------
  # Airflow: webserver, scheduler, worker, init
  # ---------------------------------------------------------------
  af-webserver:
    <<: *airflow-common
    container_name: af-webserver
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  af-scheduler:
    <<: *airflow-common
    container_name: af-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  af-worker:
    <<: *airflow-common
    container_name: af-worker
    command: celery worker
    ports:
      - "4041:4041"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: "no"
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
    command:
      - bash
      - -c
      - |
          echo "Airflow version:"
          airflow version

          # Spark (local mode – PySpark installed in image)
          airflow connections add 'spark_default' \
            --conn-type 'spark' \
            --conn-host 'local' \
            --conn-extra '{"spark-binary": "spark-submit", "deploy-mode": "client"}' \
            --overwrite || true

          # Single Postgres database (${POSTGRES_DB}); SQL in DAGs uses namespaces web.*, oms.*, etc.
          # Airflow PostgresHook puts --conn-schema into the DB name segment of the URI (not search_path).
          # Use $$ so Compose leaves $POSTGRES_DB for bash (env set from x-airflow-env).
          for SCHEMA in web oms wms marketing; do
            airflow connections add "$${SCHEMA}_db" \
              --conn-type 'postgres' \
              --conn-host 'postgres' \
              --conn-login "$${POSTGRES_USER}" \
              --conn-password "$${POSTGRES_PASSWORD}" \
              --conn-schema "$${POSTGRES_DB}" \
              --conn-port 5432 \
              --overwrite || true
          done

          airflow connections add 'metadata_db' \
            --conn-type 'postgres' \
            --conn-host 'postgres' \
            --conn-login "$${POSTGRES_USER}" \
            --conn-password "$${POSTGRES_PASSWORD}" \
            --conn-schema "$${POSTGRES_DB}" \
            --conn-port 5432 \
            --overwrite || true

          airflow connections add 'postgres_default' \
            --conn-type 'postgres' \
            --conn-host 'postgres' \
            --conn-login "$${POSTGRES_USER}" \
            --conn-password "$${POSTGRES_PASSWORD}" \
            --conn-schema "$${POSTGRES_DB}" \
            --conn-port 5432 \
            --overwrite || true

          # MinIO / S3
          airflow connections add 'minios3_conn' \
            --conn-type 'aws' \
            --conn-login "$${MINIO_ROOT_USER}" \
            --conn-password "$${MINIO_ROOT_PASSWORD}" \
            --conn-extra '{"endpoint_url": "http://minio:9000"}' \
            --overwrite || true

          # ClickHouse (generic HTTP hook via clickhouse-connect)
          airflow connections add 'clickhouse_conn' \
            --conn-type 'generic' \
            --conn-host 'clickhouse' \
            --conn-port 8123 \
            --conn-login "$${CLICKHOUSE_USER}" \
            --conn-password "$${CLICKHOUSE_PASSWORD}" \
            --overwrite || true

          echo "All connections registered."

  # ---------------------------------------------------------------
  # BI: Apache Superset
  # ---------------------------------------------------------------
  superset:
    container_name: superset
    build:
      context: ./superset_dockerfile
      dockerfile: Dockerfile
    environment:
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    volumes:
      - ./superset_data:/app/superset_home
    ports:
      - "8088:8088"
    depends_on:
      - postgres
      - clickhouse
    networks:
      - all_in_one

  # ---------------------------------------------------------------
  # MinIO: S3-compatible staging layer
  # ---------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9001:9001"   # Console UI
      - "9002:9000"   # S3 API
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./s3_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - all_in_one

  create-bucket:
    image: minio/mc
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
        echo 'Waiting for MinIO...';
        sleep 5;
      done;
      mc mb -p local/${MINIO_PROD_BUCKET_NAME} || true;
      mc anonymous set public local/${MINIO_PROD_BUCKET_NAME} || true;
      mc mb -p local/${MINIO_DEV_BUCKET_NAME} || true;
      mc anonymous set public local/${MINIO_DEV_BUCKET_NAME} || true;
      echo 'Buckets ready.'
      "
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - all_in_one

volumes:
  postgres-db-volume:
  clickhouse-data:

networks:
  all_in_one:
    driver: bridge
