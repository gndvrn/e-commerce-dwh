[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

markers =
    unit: pure unit tests, no external services required
    integration: requires running Docker services (postgres, clickhouse, minio)
    airflow: requires apache-airflow installed and AIRFLOW_HOME configured
    slow: slow tests that can be skipped in fast CI runs
