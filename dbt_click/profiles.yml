dbt_click:
  target: prod
  outputs:
    prod:
      type: clickhouse
      schema: staging
      host: clickhouse
      port: 9000
      user: "{{ env_var('CLICKHOUSE_USER', 'admin') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'admin') }}"
      secure: False
      verify: False
      connect_timeout: 10
      send_receive_timeout: 300
