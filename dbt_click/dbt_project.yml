name: dbt_click
version: '1.0.0'
config-version: 2

profile: dbt_click

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_click:
    staging:
      +materialized: view
      +schema: staging

    core:
      +materialized: table
      +schema: core

    datamart:
      +materialized: table
      +schema: datamart
